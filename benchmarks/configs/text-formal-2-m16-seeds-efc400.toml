[[sweep]]
n = [100000]
m = [16]
ef_construction = [200]
seeds = [2, 3, 4, 5]
shuffles = []

[[sweep]]
n = [100000]
m = [16]
ef_construction = [400]
seeds = [1]
shuffles = []
