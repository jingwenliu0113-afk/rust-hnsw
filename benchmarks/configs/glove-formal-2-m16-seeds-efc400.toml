# 正式 run（decision 013）：GloVe n = 100,000。
# 第一個 sweep：(16, 200) 的 seeds 2–5（原始順序），與 glove-formal-1-m16-order.toml 合起來是完整 variance 格點；shuffles 必須為空。
# 第二個 sweep：efC 掃描的 (16, 400)，seed 1。兩者共用 (16, 200) 的 ef 清單（013 §2）。
# child_timeout_s 依 013 §6。
schema_version = 1
dataset = "glove-100-angular"
implementations = ["rust-hnsw", "hnswlib", "faiss-hnsw"]
ef_search = [64, 96, 128, 152, 192, 256, 304, 384]
child_timeout_s = 3000

[[sweep]]
n = [100000]
m = [16]
ef_construction = [200]
seeds = [2, 3, 4, 5]
shuffles = []

[[sweep]]
n = [100000]
m = [16]
ef_construction = [400]
seeds = [1]
shuffles = []
